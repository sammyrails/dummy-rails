default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: localhost
  port: 5432
  username: <%= ENV.fetch("POSTGRES_USER", "sammy") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "") %>

development:
  <<: *default
  database: tracelit_test_development

test:
  <<: *default
  database: tracelit_test_test

production:
  <<: *default
  database: tracelit_test_production
  username: <%= ENV.fetch("POSTGRES_USER", "sammy") %>
  password: <%= ENV["POSTGRES_PASSWORD"] %>
